Name=pkgconf
Version=2.3.0
Namespace=app
Description="pkg-config implementation"
Url=https://distfiles.ariadne.space/pkgconf/pkgconf-2.3.0.tar.xz
ConfigureFlags=(--disable-static)
Dependencies=(glibc)

# pkgconf only installs /usr/bin/pkgconf. Every configure script in the world
# asks for pkg-config by that other name, so a build inside this system finds no
# pkg-config and stops - dbus did exactly that, on expat, which is installed.
# The alias belongs to the distribution, not to each recipe that hits it.
Build() {
mkdir -p "$BuildDirectory"
cd "$BuildDirectory" || exit 1
"$SourceDirectory/configure" --prefix=/usr ${ConfigureFlags[@]} || exit 1
make -j"$(nproc)" || exit 1
make DESTDIR="$InstallRoot" install || exit 1
ln -sfn pkgconf "$InstallRoot/usr/bin/pkg-config"
}
