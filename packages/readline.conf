Name=readline
Version=8.2
Namespace=GNU
Description="GNU Readline"
Url=https://mirrors.kernel.org/gnu/readline/readline-8.2.tar.gz
Dependencies=(glibc ncurses)
Build() {
cd "$SourceDirectory" || exit 1
./configure \
    --prefix=/usr \
    --with-curses \
    --enable-shared \
    --disable-static \
    CPPFLAGS="-I$InstallRoot/usr/include" \
    LDFLAGS="-L$InstallRoot/usr/lib -Wl,-rpath-link,$InstallRoot/usr/lib" \
    LIBS="-ltinfo" \
    || exit 1
make -j"$(nproc)" SHLIB_LIBS="-ltinfo" || exit 1
make DESTDIR="$InstallRoot" install || exit 1
}
ExtraPackages=()
