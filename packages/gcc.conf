Name=gcc
Version=16.2.0
Namespace=GNU
Description="GNU Compiler Collection"
Url=https://mirrors.kernel.org/gnu/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz
Dependencies=(glibc)
Build() {
cd "$SourceDirectory"
./contrib/download_prerequisites
mkdir -p "$WorkRoot/gcc-build"
cd "$WorkRoot/gcc-build"
"$SourceDirectory/configure" --prefix=/usr --enable-languages=c,c++ --disable-bootstrap --disable-multilib --disable-nls
make -j"$(nproc)"
make DESTDIR="$InstallRoot" install
}
ExtraPackages=(flex bison gawk texinfo wget libgmp-dev libmpfr-dev libmpc-dev)
