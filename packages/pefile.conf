Name=pefile
Version=2024.8.26
Namespace=app
Description="PE file parser, used while generating the boot hwids section"
Url=https://files.pythonhosted.org/packages/03/4f/2750f7f6f025a1507cd3b7218691671eecfd0bbebebe8b39aa0fe1d360b8/pefile-2024.8.26.tar.gz
Dependencies=(glibc python)
# systemd generates src/boot/test-hwids-section.c by reading PE headers out of
# the hwids it carries, and that script imports ukify, which imports pefile. It
# stopped at 2068 of 2718 targets without it.
#
# pefile is one module in one file, so installing it is copying that file. Its
# setup.py would need setuptools, which this system does not have.
Build() {
cd "$SourceDirectory" || exit 1
mkdir -p "$InstallRoot/usr/lib/python3.13/site-packages"
cp -a pefile.py "$InstallRoot/usr/lib/python3.13/site-packages/" || exit 1
# pefile imports ordlookup, which ships beside it as a directory of its own.
cp -a ordlookup "$InstallRoot/usr/lib/python3.13/site-packages/" || exit 1
}
ExtraPackages=()