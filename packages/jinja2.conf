Name=jinja2
Version=3.1.6
Namespace=app
Description="template engine systemd's build uses"
Url=https://files.pythonhosted.org/packages/df/bf/f7da0350254c0ed7c72f3e33cef02e048281fec7ecec5f032d4aac52226b/jinja2-3.1.6.tar.gz
Dependencies=(glibc python markupsafe)
# systemd's meson build imports jinja2 to generate files, and stops with
# "python3 is missing modules: jinja2" without it. It is a build dependency of
# one package, but a distribution needs it anyway: anything that generates
# configuration from templates wants it.
ExtraPackages=()
# Pure python, so installing it is copying the package where python looks.
# setup.py install is not an option: python 3.13 removed distutils, and
# setuptools is not installed either, so it would fail before it started.
Build() {
cd "$SourceDirectory" || exit 1
mkdir -p "$InstallRoot/usr/lib/python3.13/site-packages"
cp -a src/jinja2 "$InstallRoot/usr/lib/python3.13/site-packages/" || exit 1
}
