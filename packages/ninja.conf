Name=ninja
Version=1.12.1
Namespace=app
Description="small build system that meson drives"
Url=https://github.com/ninja-build/ninja/archive/refs/tags/v1.12.1.tar.gz
Dependencies=(glibc python)
# ninja's configure.py --bootstrap compiles ninja with the C++ compiler directly,
# which is the only way to build it without already having ninja. systemd and
# iputils are meson projects, and meson drives ninja, so this is what stands
# between those two and being built by the system itself.
Build() {
cd "$SourceDirectory"
python3 configure.py --bootstrap || exit 1
mkdir -p "$InstallRoot/usr/bin"
install -m 755 ninja "$InstallRoot/usr/bin/ninja"
}
ExtraPackages=()