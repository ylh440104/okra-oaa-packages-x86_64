Name=dbus
Version=1.14.10
Namespace=app
Description="The message bus the session manager talks to"
Url=https://dbus.freedesktop.org/releases/dbus/dbus-1.14.10.tar.xz
Dependencies=(glibc expat pkgconf)
ConfigureFlags=(--libdir=/usr/lib --disable-docs --disable-tests --disable-selinux --disable-systemd --disable-epoll --with-session-socket-dir=/run/dbus)
# The bus is started by systemd, not by the package: a post-install step that
# started it would need a running system, and a package does not have one.
Build() {
cd "$SourceDirectory"
# pkg-config is asked for by name, and the tree this is built in may still
# hold the pkgconf from before the alias was added: a rebuild packs a package,
# it does not install it, so a fix to pkgconf only reaches this tree on the
# next install. Naming the tool outright works either way.
PKG_CONFIG=pkgconf ./configure --prefix=/usr ${ConfigureFlags[@]} || exit 1
make -j"$(nproc)" || exit 1
make DESTDIR="$InstallRoot" install || exit 1
}