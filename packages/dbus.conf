Name=dbus
Version=1.14.10
Namespace=app
Description="The message bus the session manager talks to"
Url=https://dbus.freedesktop.org/releases/dbus/dbus-1.14.10.tar.xz
Dependencies=(glibc expat pkgconf)
ConfigureFlags=(--libdir=/usr/lib --disable-docs --disable-tests --disable-selinux --disable-epoll --with-session-socket-dir=/run/dbus)
# The bus is started by systemd, not by the package: a post-install step that
# started it would need a running system, and a package does not have one.
Build() {
cd "$SourceDirectory"
# pkg-config is asked for by name, and the tree this is built in may still
# hold the pkgconf from before the alias was added: a rebuild packs a package,
# it does not install it, so a fix to pkgconf only reaches this tree on the
# next install. Naming the tool outright works either way.
# systemd support is on: it is what installs dbus.service and dbus.socket,
# and without those the bus never starts and every service that talks to
# it fails - logind among them. libsystemd.pc lives in /usr/lib/pkgconfig
# and pkg-config does not look there by default on this tree.
export PKG_CONFIG_PATH="/usr/lib/pkgconfig:/usr/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
pkg-config --exists libsystemd \
	&& echo "== dbus sees libsystemd $(pkg-config --modversion libsystemd)" \
	|| echo "== dbus does NOT see libsystemd" >&2
PKG_CONFIG=pkgconf ./configure --prefix=/usr ${ConfigureFlags[@]} || exit 1
make -j"$(nproc)" || exit 1
make DESTDIR="$InstallRoot" install || exit 1
}