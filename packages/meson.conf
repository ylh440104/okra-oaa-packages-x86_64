Name=meson
Version=1.5.1
Namespace=app
Description="build system written in python"
Url=https://github.com/mesonbuild/meson/archive/refs/tags/1.5.1.tar.gz
Dependencies=(glibc python ninja)
# meson is a python package plus a launcher, so installing it is copying the
# module somewhere importable and writing the entry point. No pip in this
# system, and it does not need one.
Build() {
mkdir -p "$InstallRoot/usr/lib/meson" "$InstallRoot/usr/bin"
cp -a mesonbuild "$InstallRoot/usr/lib/meson/" || exit 1
printf '%s\n' \
	'#!/usr/bin/env python3' \
	'import sys' \
	"sys.path.insert(0, '/usr/lib/meson')" \
	'from mesonbuild.mesonmain import main' \
	'sys.exit(main())' \
	> "$InstallRoot/usr/bin/meson"
chmod 755 "$InstallRoot/usr/bin/meson"
}
ExtraPackages=()