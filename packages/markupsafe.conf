Name=markupsafe
Version=2.1.5
Namespace=app
Description="safe string handling for jinja2"
Url=https://files.pythonhosted.org/packages/source/M/MarkupSafe/MarkupSafe-2.1.5.tar.gz
Dependencies=(glibc python)
# The C speedups are not built: markupsafe falls back to its python
# implementation, and a template engine does not need the speed.
ExtraPackages=()
# Pure python, so installing it is copying the package where python looks.
# setup.py install is not an option: python 3.13 removed distutils, and
# setuptools is not installed either, so it would fail before it started.
Build() {
cd "$SourceDirectory" || exit 1
mkdir -p "$InstallRoot/usr/lib/python3.13/site-packages"
cp -a src/markupsafe "$InstallRoot/usr/lib/python3.13/site-packages/" || exit 1
}
