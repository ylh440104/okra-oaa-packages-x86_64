Name=markupsafe
Version=2.1.5
Namespace=app
Description="safe string handling for jinja2"
Url=https://files.pythonhosted.org/packages/source/M/MarkupSafe/MarkupSafe-2.1.5.tar.gz
Dependencies=(glibc python)
# Installed by its own setup.py because this system has no pip. The C speedups
# are optional: markupsafe falls back to the python implementation when the
# extension is not built, and nothing here needs the speed.
Build() {
cd "$SourceDirectory" || exit 1
python3 setup.py install --root="$InstallRoot" --prefix=/usr >/dev/null || exit 1
}
ExtraPackages=()