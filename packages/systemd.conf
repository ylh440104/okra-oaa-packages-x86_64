Name=systemd
Version=262
Namespace=app
Description="systemd init and service manager"
Url=https://github.com/systemd/systemd/archive/refs/tags/v262.tar.gz
Dependencies=(glibc util-linux kmod libseccomp pcre2 zstd xz bzip2 zlib)
Build() {
	cd "$SourceDirectory"
	AvailableOptions="$(meson setup "$BuildDirectory" --help 2>/dev/null | grep -oE '^  -D[a-zA-Z0-9_-]+' | sed 's/^  //' || true)"
	WantedOptions=(
		-Dsplit-usr=true
		-Ddefault-hierarchy=unified
		-Dnss-myhostname=enabled
		-Dnss-systemd=enabled
		-Dnss-resolve=disabled
		-Dnss-mymachines=disabled
		-Dutmp=false
		-Dldconfig=true
		-Dresolve=true
		-Dnetworkd=true
		-Dtimesyncd=true
		-Dlocaled=true
		-Dlogind=true
		-Dhostnamed=true
		-Dtimedated=true
		-Dcoredump=true
		-Dbinfmt=true
		-Dvconsole=true
		-Drandomseed=true
		-Drfkill=true
		-Dbacklight=true
		-Dblkid=true
		-Dseccomp=true
		-Dkmod=true
		-Dpcre2=true
		-Dzstd=true
		-Dxz=true
		-Dbzip2=true
		-Dportabled=false
		-Duserdb=false
		-Dhomed=false
		-Drepart=false
		-Dsysupdate=false
		-Dpstore=false
		-Doomd=false
		-Dpolkit=false
		-Dima=false
		-Dsmack=false
		-Dapparmor=false
		-Dselinux=false
		-Daudit=false
		-Dpam=false
		-Dacl=false
		-Dlz4=false
		-Dopenssl=false
		-Dgcrypt=false
		-Dgnutls=false
		-Dlibcurl=false
		-Dlibidn2=false
		-Dqrencode=false
		-Delfutils=false
		-Dlibcryptsetup=false
		-Dman=false
		-Dhtml=false
		-Dtranslations=false
		-Dtests=false
		-Dinstall-tests=false
		-Ddbus=false
		-Dglib=false
		-Dtpm=false
		-Dtpm2=false
		-Dfirstboot=false
		-Defi=false
		-Dbootloader=false
		-Dukify=false
		-Dkernel-install=false
		-Dquotacheck=false
	)
	FilteredOptions=()
	for Option in "${WantedOptions[@]}"; do
		Key="${Option%%=*}"
		if printf '%s\n' "$AvailableOptions" | grep -qx -- "$Key"; then
			FilteredOptions+=("$Option")
		else
			echo "skipping unknown option $Option"
		fi
	done
	meson setup "$BuildDirectory" --prefix=/usr --libdir=lib --buildtype=release "${FilteredOptions[@]}"
	ninja -C "$BuildDirectory" -j"$(nproc)"
	DESTDIR="$InstallRoot" fakeroot ninja -C "$BuildDirectory" install
}
ExtraPackages=(meson ninja-build gperf)
