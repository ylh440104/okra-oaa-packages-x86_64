Name=tzdata
# Upstream calls this 2025a. The resolver reads three integers and refuses
# anything it cannot account for, because a suffix it silently dropped would
# make 2025a and 2025b the same version and hide the upgrade.
Version=2025.1
Namespace=app
Description="IANA time zone database"
Url=https://data.iana.org/time-zones/releases/tzdata2025a.tar.gz
ArchiveFormat=flat
Dependencies=()
Build() {
mkdir -p "$InstallRoot/usr/share/zoneinfo" "$InstallRoot/etc"
cd "$SourceDirectory"
zic -b fat -d "$InstallRoot/usr/share/zoneinfo" africa antarctica asia australasia europe northamerica southamerica etcetera backward factory
printf 'UTC\n' > "$InstallRoot/etc/timezone"
}
