Name=base-files
Version=1.0
Namespace=app
Description="the filesystem skeleton and the files nothing else provides"
# There is no upstream tarball: this package is what the distribution decides
# its own root looks like.
NoSource=1
ArchiveFormat=none
Dependencies=()

# The directories a running system needs before any package puts something in
# them, the files that identify the system, and /bin/sh. Everything here used to
# be written by the bootstrap's own scripts, which meant the files closest to
# the system were the ones no package owned: `lunar list` would not mention
# /etc/passwd, uninstall would not restore it, and nothing could say where it
# came from.
Build() {
	local Directory
	for Directory in \
		bin sbin etc etc/skel etc/profile.d usr usr/lib usr/local usr/local/bin \
		usr/local/sbin usr/local/lib usr/share usr/include opt srv mnt media \
		home root var var/lib var/log var/cache var/tmp proc sys dev run tmp
	do
		mkdir -p "$InstallRoot/$Directory"
	done
	chmod 1777 "$InstallRoot/tmp" "$InstallRoot/var/tmp"
	chmod 0700 "$InstallRoot/root"

	# split-usr, because glibc installs /sbin/ldconfig and /lib64/ld-linux.
	# /bin holds the two names a shell is expected to answer to; everything else
	# lives in /usr/bin. Without /bin/bash the chroot entry points and the
	# verification both fail, which is how this package came to own both.
	ln -sfn /usr/bin/bash "$InstallRoot/bin/sh"
	ln -sfn /usr/bin/bash "$InstallRoot/bin/bash"

	printf '%s\n' \
		'root:x:0:0:root:/root:/bin/sh' \
		'daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin' \
		'bin:x:2:2:bin:/bin:/usr/sbin/nologin' \
		'nobody:x:65534:65534:nobody:/nonexistent:/usr/sbin/nologin' \
		> "$InstallRoot/etc/passwd"
	printf '%s\n' \
		'root:x:0:root' \
		'daemon:x:1:root' \
		'bin:x:2:root' \
		'adm:x:4:root' \
		'wheel:x:10:root' \
		'nogroup:x:65534:root' \
		> "$InstallRoot/etc/group"
	printf '%s\n' \
		'root:*:19000:0:99999:7:::' \
		'daemon:*:19000:0:99999:7:::' \
		'bin:*:19000:0:99999:7:::' \
		'nobody:*:19000:0:99999:7:::' \
		> "$InstallRoot/etc/shadow"
	chmod 0640 "$InstallRoot/etc/shadow"

	printf '%s\n' \
		'okra' \
		> "$InstallRoot/etc/hostname"
	printf '%s\n' \
		'127.0.0.1	localhost' \
		'::1		localhost' \
		'127.0.1.1	okra' \
		> "$InstallRoot/etc/hosts"

	printf '%s\n' \
		'NAME="Okra"' \
		'ID=okra' \
		'VERSION_ID=0' \
		'PRETTY_NAME="Okra Rolling Linux"' \
		'HOME_URL="https://okra.invalid/"' \
		> "$InstallRoot/etc/os-release"
	ln -sfn os-release "$InstallRoot/usr/lib/os-release"

	# Without nsswitch every lookup by name fails, including the ones the C
	# library does for its own account.
	printf '%s\n' \
		'passwd:	files' \
		'group:	files' \
		'shadow:	files' \
		'hosts:	files' \
		'services:	files' \
		> "$InstallRoot/etc/nsswitch.conf"

	printf '%s\n' \
		'/dev/root	/		ext4	defaults	0 1' \
		'proc		/proc		proc	defaults	0 0' \
		'sysfs		/sys		sysfs	defaults	0 0' \
		'devpts		/dev/pts	devpts	defaults	0 0' \
		'tmpfs		/dev/shm	tmpfs	defaults	0 0' \
		> "$InstallRoot/etc/fstab"

	printf '%s\n' \
		'/usr/lib64' \
		'/usr/lib' \
		'/lib64' \
		'/lib' \
		> "$InstallRoot/etc/ld.so.conf"

	printf '%s\n' \
		'/bin/sh' \
		'/bin/bash' \
		> "$InstallRoot/etc/shells"

	printf '%s\n' \
		'export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin' \
		'umask 022' \
		> "$InstallRoot/etc/profile"
}
