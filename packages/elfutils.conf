Name=elfutils
Version=0.192
Namespace=app
Description="ELF utilities and libelf, which objtool needs"
Url=https://sourceware.org/elfutils/ftp/0.192/elfutils-0.192.tar.bz2
Dependencies=(glibc zlib xz bzip2 zstd)
# The kernel objtool includes gelf.h and links libelf. Neither is in this
# repository, and the kernel build cannot avoid objtool: x86_64 selects the ORC
# unwinder, which is what builds it. Without this package the build stops on
#   objtool/include/objtool/elf.h:10:10: fatal error: gelf.h: No such file
#
# --disable-werror because the system compiler is gcc 16 while this release
# still treats warnings as errors: riscv_disasm.c trips -Wdiscarded-qualifiers
# and the build stops on code that is not wrong, only older than the compiler.
#
# libdw and libasm are not switched off; objtool does not use them, but readelf
# and the rest of the tools do, and they cost little.
Build() {
cd "$SourceDirectory" || exit 1
# The flags this project carries include -Werror, and gcc 16 warns
# about a const qualifier in riscv_disasm.c that older compilers did
# not. Take -Werror out of CFLAGS; --disable-werror is not wired up.
CFLAGS="$(echo "$CFLAGS" | sed 's/-Werror[^ ]*//g') -O2"
export CFLAGS
./configure \
    --prefix=/usr \
    --disable-debuginfod \
    --disable-libdebuginfod \
    --disable-demangler \
    --without-bzlib \
    || exit 1
make -j"$(nproc)" || exit 1
make DESTDIR="$InstallRoot" install || exit 1
}
ExtraPackages=()