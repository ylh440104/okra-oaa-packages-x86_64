Name=elfutils
Version=0.192
Namespace=app
Description="libelf and the ELF headers objtool needs"
Url=https://sourceware.org/elfutils/ftp/0.192/elfutils-0.192.tar.bz2
Dependencies=(glibc zlib xz bzip2 zstd)
# The kernel objtool includes gelf.h and links libelf. Neither is in this
# repository, and the kernel build cannot avoid objtool: x86_64 selects the ORC
# unwinder, which is what builds it. Without this package the build stops on
#   objtool/include/objtool/elf.h:10:10: fatal error: gelf.h: No such file
#
# The full source does not compile with gcc 16. libcpu/riscv_disasm.c assigns a
# const qualified pointer to one that is not, gcc 16 reports it, and this release
# turns that report into an error. Four attempts to silence it all failed:
#   --disable-werror     not wired into this project's configure
#   CFLAGS=...           never reached the compile line
#   sed over -Werror     matched inside a make $(if ...) call and broke the
#                        Makefile, then matched too narrowly the second time
#   stripping from every generated Makefile   the flag still reached the compiler
#
# So this does not build the whole tree. objtool wants libelf and its headers and
# nothing else from elfutils, and libcpu is a disassembler that nothing in the
# kernel calls. Building the two directories that carry libelf produces the same
# thing as building everything and then deleting most of it.
Build() {
cd "$SourceDirectory" || exit 1
./configure \
    --prefix=/usr \
    --disable-debuginfod \
    --disable-libdebuginfod \
    --disable-demangler \
    --without-bzlib \
    || exit 1
# lib carries the shared code, libelf is libelf; both are needed and neither
# holds the code gcc 16 rejects.
make -C lib -j"$(nproc)" || exit 1
make -C libelf -j"$(nproc)" || exit 1
make -C lib DESTDIR="$InstallRoot" install || exit 1
make -C libelf DESTDIR="$InstallRoot" install || exit 1
# The headers are installed by the toplevel rules rather than by either
# subdirectory, so they are copied by hand.
mkdir -p "$InstallRoot/usr/include/elfutils"
for Header in libelf.h gelf.h nlist.h; do
    [ -f "./libelf/$Header" ] && install -Dm644 "./libelf/$Header" \
        "$InstallRoot/usr/include/$Header"
done
for Header in elfutils/lib.h elfutils/elf-knowledge.h elfutils/version.h \
              elfutils/color.h elfutils/system.h; do
    [ -f "./lib/../$Header" ] && install -Dm644 "./lib/../$Header" \
        "$InstallRoot/usr/include/$Header"
done
# objtool links with -lelf and looks for the pkg-config entry.
mkdir -p "$InstallRoot/usr/lib/pkgconfig"
sed "s|^prefix=.*|prefix=/usr|" ./libelf/libelf.pc \
    > "$InstallRoot/usr/lib/pkgconfig/libelf.pc" 2>/dev/null || true
}
ExtraPackages=()