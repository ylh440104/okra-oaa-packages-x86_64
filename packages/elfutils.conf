Name=elfutils
Version=0.192
Namespace=app
Description="ELF utilities and libelf, which objtool needs"
Url=https://sourceware.org/elfutils/ftp/0.192/elfutils-0.192.tar.bz2
Dependencies=(glibc zlib xz bzip2 zstd)
# The kernel objtool includes gelf.h and links libelf. Neither is in this
# repository, and the kernel build cannot avoid objtool: x86_64 selects the ORC
# unwinder, which is what builds it. Without this package the build stops on
#   objtool/include/objtool/elf.h:10:10: fatal error: gelf.h: No such file
#
# The system compiler is gcc 16 and this release predates it. riscv_disasm.c
# assigns a const qualified pointer to one that is not; gcc 16 reports it and
# the release treats that report as an error, so the build stops on code that is
# not wrong.
#
# Two attempts to silence it failed. --disable-werror is not wired into this
# project's configure, and setting CFLAGS did not reach the compile line. A sed
# over "anything starting with -Werror" did reach it, but it also ate the
# argument of a make $(if ...) call and left the Makefile unparsable. What
# follows removes the option where it appears as an option, and leaves the
# function calls alone.
Build() {
cd "$SourceDirectory" || exit 1
./configure \
    --prefix=/usr \
    --disable-debuginfod \
    --disable-libdebuginfod \
    --disable-demangler \
    --without-bzlib \
    || exit 1
find . -name Makefile -print0 | xargs -0 sed -i \
    -e 's/-Werror=[a-z-]*//g' \
    -e 's/-Werror[[:space:]]\+//g' \
    -e 's/[[:space:]]\+-Werror$//g' \
    || exit 1
make -j"$(nproc)" || exit 1
make DESTDIR="$InstallRoot" install || exit 1
}
ExtraPackages=()