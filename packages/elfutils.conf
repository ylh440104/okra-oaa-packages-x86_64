Name=elfutils
Version=0.192
Namespace=app
Description="ELF utilities and libelf, which objtool needs"
Url=https://sourceware.org/elfutils/ftp/0.192/elfutils-0.192.tar.bz2
Dependencies=(glibc zlib xz bzip2 zstd)
# The kernel's objtool links against libelf and includes gelf.h. Without them
# the build stops on
#   objtool/include/objtool/elf.h:10:10: fatal error: gelf.h: No such file
# which no amount of configuration avoids, because x86_64 selects the ORC
# unwinder and that is what builds objtool.
#
# Only libelf and the tools are built here: libdw and libasm are not needed by
# objtool, and each one is more of the same dependency chain.
Build() {
cd "$SourceDirectory" || exit 1
./configure \
    --prefix=/usr \
    --disable-debuginfod \
    --disable-libdebuginfod \
    --disable-demangler \
    --without-bzlib \
    || exit 1
make -j"$(nproc)" || exit 1
make DESTDIR="$InstallRoot" install || exit 1
}
ExtraPackages=()