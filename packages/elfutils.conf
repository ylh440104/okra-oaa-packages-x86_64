Name=elfutils
Version=0.192
Namespace=app
Description="ELF utilities and libelf, which objtool needs"
Url=https://sourceware.org/elfutils/ftp/0.192/elfutils-0.192.tar.bz2
Dependencies=(glibc zlib xz bzip2 zstd)
# The kernel objtool includes gelf.h and links libelf. Neither is in this
# repository, and the kernel build cannot avoid objtool: x86_64 selects the ORC
# unwinder, which is what builds it. Without this package the build stops on
#   objtool/include/objtool/elf.h:10:10: fatal error: gelf.h: No such file
#
# The system compiler is gcc 16 and this release predates it. riscv_disasm.c in
# libcpu assigns a const qualified pointer to one that is not, which gcc 16
# reports and the release has -Werror set for, so the build stops on code that
# is not wrong. Neither --disable-werror nor editing CFLAGS reached the compile
# line; the flag sits in the generated build rules. Taking it out of the
# Makefiles after configure does reach it.
Build() {
cd "$SourceDirectory" || exit 1
./configure \
    --prefix=/usr \
    --disable-debuginfod \
    --disable-libdebuginfod \
    --disable-demangler \
    --without-bzlib \
    || exit 1
find . -name Makefile -exec sed -i 's/-Werror[^ ]*//g' {} + || exit 1
make -j"$(nproc)" || exit 1
make DESTDIR="$InstallRoot" install || exit 1
}
ExtraPackages=()