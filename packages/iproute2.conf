Name=iproute2
Version=6.12.0
Namespace=app
Description="iproute2 network tools"
Url=https://mirrors.edge.kernel.org/pub/linux/utils/net/iproute2/iproute2-6.12.0.tar.xz
Dependencies=(glibc)
Build() {
cd "$SourceDirectory"
./configure --prefix=/usr
make -j"$(nproc)" SBINDIR=/usr/bin
make DESTDIR="$InstallRoot" SBINDIR=/usr/bin install
}
