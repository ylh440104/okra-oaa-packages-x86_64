Name=bzip2
Version=1.0.8
Namespace=app
Description="bzip2 compression tools"
Url=https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz
Dependencies=(glibc)
Build() {
cd "$SourceDirectory"
sed -i 's|^CC=.*|CC=gcc|' Makefile
make -j"$(nproc)" CFLAGS="-Wall -O2 -fPIC -D_FILE_OFFSET_BITS=64"
make -f Makefile-libbz2_so CFLAGS="-Wall -O2 -fPIC -D_FILE_OFFSET_BITS=64"
make install PREFIX="$InstallRoot/usr"
mkdir -p "$InstallRoot/usr/lib"
install -m755 "$SourceDirectory/libbz2.so.1.0.8" "$InstallRoot/usr/lib/libbz2.so.1.0.8"
ln -sf libbz2.so.1.0.8 "$InstallRoot/usr/lib/libbz2.so.1.0"
ln -sf libbz2.so.1.0.8 "$InstallRoot/usr/lib/libbz2.so.1"
ln -sf libbz2.so.1.0.8 "$InstallRoot/usr/lib/libbz2.so"
}
