name: Build OAA packages

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/build-packages.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      package:
        description: 'Single package name to build (empty builds everything)'
        required: false
        default: ''
      publish:
        description: 'Upload the built artifacts to the packages release'
        type: boolean
        default: true

concurrency:
  group: oaa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.package }}" ]; then
            names="${{ github.event.inputs.package }}"
          else
            names="$(cd packages && ls *.conf | sed 's/\.conf$//' | sort | tr '\n' ' ')"
          fi
          echo "packages=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1].split()))' "$names")" >> "$GITHUB_OUTPUT"
          echo "count=$(echo $names | wc -w)" >> "$GITHUB_OUTPUT"
          echo "building: $names"

  build:
    needs: collect
    if: needs.collect.outputs.count != '0'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        package: ${{ fromJson(needs.collect.outputs.packages) }}
    name: ${{ matrix.package }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates tar xz-utils zstd gzip bzip2 \
            lzip file rsync python3 pkg-config fakeroot

      - name: Fetch the okrapm toolchain sources
        run: |
          git clone --depth 1 https://github.com/OkraLinux/okrapm.git okrapm
          chmod +x okrapm/oaatools/*

      - name: Build the package
        run: |
          mkdir -p "$RUNNER_TEMP/okra-artifacts"
          OKRA_OAATOOLS="$PWD/okrapm/oaatools" ./scripts/build-package.sh "${{ matrix.package }}"

      - name: Verify the artifact
        run: |
          ./okrapm/oaatools/oaatools verify "$RUNNER_TEMP/okra-artifacts/${{ matrix.package }}"/*.oaa
          ./okrapm/oaatools/oaatools inspect "$RUNNER_TEMP/okra-artifacts/${{ matrix.package }}"/*.oaa

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oaa-${{ matrix.package }}
          path: |
            ${{ runner.temp }}/okra-artifacts/${{ matrix.package }}/*.oaa
            ${{ runner.temp }}/okra-artifacts/${{ matrix.package }}/*.sha256
            ${{ runner.temp }}/okra-artifacts/${{ matrix.package }}/*.sources
          if-no-files-found: error

  commit-metadata:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: oaa-*
          merge-multiple: false
          path: artifacts

      - name: Collect checksums and source records
        run: |
          set -euo pipefail
          mkdir -p out
          for directory in artifacts/*/; do
            name="$(basename "$directory")"
            name="${name#oaa-}"
            mkdir -p "out/$name"
            cp "$directory"/*.sha256 "out/$name/" 2>/dev/null || true
            cp "$directory"/*.sources "out/$name/" 2>/dev/null || true
          done
          find out -type f | sort

      - name: Commit the refreshed metadata
        run: |
          set -euo pipefail
          git config user.name "Okra OAA Build"
          git config user.email "ylh440104@users.noreply.github.com"
          git add out
          if git diff --cached --quiet; then
            echo "no metadata change"
          else
            git commit -m "update checksums"
            git push
          fi

  publish:
    needs: [build, commit-metadata]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: oaa-*
          merge-multiple: true
          path: publish

      - name: List what will be published
        run: find publish -type f | sort

      - name: Ensure the packages release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view packages >/dev/null 2>&1 || \
            gh release create packages --title packages --notes "OkraLinux x86_64 OAA packages rebuilt with the current okrapm toolchain (OAABI 1)."

      - name: Upload the artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(publish/*.oaa)
          [ "${#files[@]}" -gt 0 ] || { echo "nothing to upload"; exit 1; }
          gh release upload packages "${files[@]}" --clobber
          echo "uploaded ${#files[@]} artifacts"