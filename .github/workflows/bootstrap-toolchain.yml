name: Bootstrap self-hosting toolchain

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space separated toolchain package order'
        required: false
        default: 'glibc binutils gcc make bash coreutils'
  push:
    branches: [main]
    paths:
      - 'scripts/build-toolchain.sh'
      - 'scripts/lib.sh'
      - 'packages/glibc.conf'
      - 'packages/binutils.conf'
      - 'packages/gcc.conf'
      - 'packages/make.conf'
      - 'packages/bash.conf'
      - 'packages/coreutils.conf'
      - '.github/workflows/bootstrap-toolchain.yml'

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OKRA_TOOLCHAIN: /opt/okra-toolchain
      OKRA_TARGET_ARCH: x86_64
      OKRA_TOOLCHAIN_PACKAGES: ${{ github.event.inputs.packages || 'glibc binutils gcc make bash coreutils' }}
    steps:
      - uses: actions/checkout@v4

      - name: Assert the runner really is x86_64
        run: |
          set -euo pipefail
          echo "uname -m: $(uname -m)"
          echo "uname -a: $(uname -a)"
          test "$(uname -m)" = "x86_64" || {
            echo "this repository only produces x86_64 packages" >&2
            exit 1
          }
          test "$OKRA_TARGET_ARCH" = "x86_64"

      - name: Run the architecture self tests
        run: ./scripts/selftest.sh

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake curl ca-certificates tar xz-utils zstd gzip \
            bzip2 lzip file rsync python3 pkg-config fakeroot wget
          sudo mkdir -p "$OKRA_TOOLCHAIN"
          sudo chown "$(id -u):$(id -g)" "$OKRA_TOOLCHAIN"

      - name: Fetch the okrapm toolchain sources
        run: |
          git clone --depth 1 https://github.com/OkraLinux/okrapm.git okrapm
          chmod +x okrapm/oaatools/*

      - name: Build the self-hosting toolchain
        run: ./scripts/build-toolchain.sh

      - name: Report what the Okra toolchain provides
        run: |
          set -euo pipefail
          export PATH="$OKRA_TOOLCHAIN/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$OKRA_TOOLCHAIN/usr/lib:$OKRA_TOOLCHAIN/usr/lib64:$OKRA_TOOLCHAIN/lib64"
          "$OKRA_TOOLCHAIN/usr/bin/lunar" --root "$OKRA_TOOLCHAIN/var/lib/lunar" list || true
          find "$OKRA_TOOLCHAIN" -maxdepth 3 -name 'ld-linux*' -o -maxdepth 3 -name 'libc.so*' | head

      - name: Run the Okra toolchain's own uname
        run: |
          set -euo pipefail
          OkraUname="$OKRA_TOOLCHAIN/usr/bin/uname"
          test -x "$OkraUname" || { echo "coreutils did not install uname" >&2; exit 1; }
          Loader="$OKRA_TOOLCHAIN/lib64/ld-linux-x86-64.so.2"
          [ -f "$Loader" ] || Loader="$(find "$OKRA_TOOLCHAIN" -maxdepth 3 -name 'ld-linux-x86-64.so.2' -type f | head -1)"
          test -f "$Loader" || { echo "no Okra dynamic loader found" >&2; exit 1; }
          echo "Okra loader:    $Loader"
          OkraMachine="$("$Loader" --library-path "$OKRA_TOOLCHAIN/usr/lib:$OKRA_TOOLCHAIN/usr/lib64:$OKRA_TOOLCHAIN/lib64" "$OkraUname" -m)"
          OkraAll="$("$Loader" --library-path "$OKRA_TOOLCHAIN/usr/lib:$OKRA_TOOLCHAIN/usr/lib64:$OKRA_TOOLCHAIN/lib64" "$OkraUname" -a)"
          echo "Okra uname -m:  $OkraMachine"
          echo "Okra uname -a:  $OkraAll"
          test "$OkraMachine" = "x86_64" || {
            echo "the Okra toolchain reports $OkraMachine, expected x86_64" >&2
            exit 1
          }
          echo "$OkraMachine" > "$RUNNER_TEMP/okra-toolchain.uname"

      - name: Package the toolchain for reuse
        run: |
          set -euo pipefail
          Archive="$RUNNER_TEMP/okra-toolchain.tar.zst"
          tar --zstd -cf "$Archive" -C "$(dirname "$OKRA_TOOLCHAIN")" "$(basename "$OKRA_TOOLCHAIN")"
          sha256sum "$Archive" | tee "$RUNNER_TEMP/okra-toolchain.tar.zst.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: okra-toolchain
          path: |
            ${{ runner.temp }}/okra-toolchain.tar.zst
            ${{ runner.temp }}/okra-toolchain.tar.zst.sha256
            ${{ runner.temp }}/okra-toolchain.uname
          if-no-files-found: error
          retention-days: 14