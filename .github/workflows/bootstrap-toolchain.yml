name: Bootstrap self-hosting toolchain (experimental)

# This workflow is experimental and manual. It builds a self-hosting Okra
# toolchain and then rebuilds every package with it, which is what makes the
# result self-hosted rather than host-built.
#
# Why a cross toolchain: the Okra userland has to be linked against the Okra
# glibc, not the host glibc. Pointing a host compiler at the Okra headers
# produces objects whose headers and libraries disagree, which is why the
# earlier host-native attempt failed with "C compiler cannot create
# executables". scripts/build-cross-toolchain.sh therefore builds
# x86_64-okra-linux-gnu with a sysroot of its own, and the packages are then
# compiled by that cross compiler with --sysroot.
#
# Reuse: the toolchain takes about half an hour to build, so the toolchain job
# publishes it as the okra-cross-toolchain artifact and every later run
# downloads it again instead of rebuilding it. A published toolchain is only
# reused when scripts/build-cross-toolchain.sh, scripts/lib.sh and the
# glibc/gcc/binutils recipes are unchanged since the run that produced it, so
# editing the toolchain always forces a rebuild. Set rebuild_toolchain to
# force one anyway.
#
# Stages:
#   toolchain  linux headers, cross binutils, gcc stage 1, glibc, gcc stage 2
#   bootstrap  every recipe rebuilt with the cross compiler into the sysroot
#
# The supported package pipeline is build-packages.yml, which does not depend
# on this workflow.
on:
  workflow_dispatch:
    inputs:
      rebuild_toolchain:
        description: 'Rebuild the cross toolchain even when a published one can be reused'
        type: boolean
        default: false
      packages:
        description: 'Space separated package list to bootstrap (empty builds all)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

env:
  OKRA_TOOLCHAIN: /opt/okra-toolchain
  OKRA_TARGET_ARCH: x86_64
  OKRA_JOBS: '4'

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The reuse check compares the toolchain inputs of the commit that
          # published the artifact with this one, so the history is needed.
          fetch-depth: 0

      - name: Reuse a published cross toolchain when possible
        id: reuse
        if: ${{ github.event.inputs.rebuild_toolchain != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OKRA_TOOLCHAIN_PROBE: '1'
        run: |
          set -uo pipefail
          # Only probe here: the bootstrap job downloads the toolchain once.
          # Downloading it in this job as well would transfer ~4 GB twice.
          if ./scripts/restore-toolchain.sh; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert the runner really is x86_64
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          echo "uname -m: $(uname -m)"
          echo "uname -a: $(uname -a)"
          test "$(uname -m)" = "x86_64" || {
            echo "this repository only produces x86_64 packages" >&2
            exit 1
          }
          test "$OKRA_TARGET_ARCH" = "x86_64"

      - name: Run the architecture self tests
        if: steps.reuse.outputs.reused != 'true'
        run: ./scripts/selftest.sh

      - name: Install host build tools
        if: steps.reuse.outputs.reused != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake curl ca-certificates tar xz-utils zstd gzip \
            bzip2 lzip file rsync python3 pkg-config fakeroot wget texinfo bison flex
          sudo mkdir -p "$OKRA_TOOLCHAIN"
          sudo chown "$(id -u):$(id -g)" "$OKRA_TOOLCHAIN"

      - name: Fetch the okrapm toolchain sources
        if: steps.reuse.outputs.reused != 'true'
        run: |
          git clone --depth 1 https://github.com/OkraLinux/okrapm.git okrapm
          chmod +x okrapm/oaatools/*

      - name: Build the cross toolchain
        if: steps.reuse.outputs.reused != 'true'
        run: ./scripts/build-cross-toolchain.sh

      - name: Show what the toolchain produced
        run: |
          set -euo pipefail
          echo "== cross prefix"
          ls "$OKRA_TOOLCHAIN/cross/bin" | head -20
          echo "== gcc target"
          "$OKRA_TOOLCHAIN/cross/bin/x86_64-okra-linux-gnu-gcc" -dumpmachine
          "$OKRA_TOOLCHAIN/cross/bin/x86_64-okra-linux-gnu-gcc" --version | head -1

      - name: Package the toolchain for the next job
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          Archive="$RUNNER_TEMP/okra-cross-toolchain.tar.zst"
          tar --zstd -cf "$Archive" -C "$(dirname "$OKRA_TOOLCHAIN")" "$(basename "$OKRA_TOOLCHAIN")"
          sha256sum "$Archive" | tee "$RUNNER_TEMP/okra-cross-toolchain.tar.zst.sha256"

      - uses: actions/upload-artifact@v4
        if: steps.reuse.outputs.reused != 'true'
        with:
          name: okra-cross-toolchain
          path: |
            ${{ runner.temp }}/okra-cross-toolchain.tar.zst
            ${{ runner.temp }}/okra-cross-toolchain.tar.zst.sha256
          if-no-files-found: error
          retention-days: 14

  bootstrap:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the cross toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/restore-toolchain.sh

      - name: Assert the toolchain is present
        run: |
          set -euo pipefail
          test -x "$OKRA_TOOLCHAIN/cross/bin/x86_64-okra-linux-gnu-gcc" || {
            echo "the cross toolchain was not restored" >&2
            exit 1
          }
          test -f "$OKRA_TOOLCHAIN/okra-sysroot/lib64/ld-linux-x86-64.so.2" || {
            echo "the Okra dynamic loader is missing" >&2
            exit 1
          }
          "$OKRA_TOOLCHAIN/cross/bin/x86_64-okra-linux-gnu-gcc" --version | head -1

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates tar xz-utils zstd gzip bzip2 \
            lzip file rsync python3 pkg-config fakeroot wget texinfo bison flex \
            autoconf automake libtool gettext autopoint meson ninja-build gperf
          sudo mkdir -p "$OKRA_TOOLCHAIN"
          sudo chown "$(id -u):$(id -g)" "$OKRA_TOOLCHAIN"

      - name: Fetch the okrapm toolchain sources
        run: |
          git clone --depth 1 https://github.com/OkraLinux/okrapm.git okrapm
          chmod +x okrapm/oaatools/*

      - name: Work out the bootstrap order
        id: order
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, re

          Requested = "${{ github.event.inputs.packages }}".split()
          Recipes = {}
          for Path in sorted(pathlib.Path("packages").glob("*.conf")):
              Text = Path.read_text(encoding="utf-8")
              Match = re.search(r"^Dependencies=\((.*)\)$", Text, re.M)
              Recipes[Path.stem] = Match.group(1).split() if Match else []

          AlwaysSkip = {"glibc"}
          Selected = set(Requested) if Requested else set(Recipes) - AlwaysSkip
          Missing = sorted(Selected - set(Recipes))
          if Missing:
              raise SystemExit("unknown packages: " + " ".join(Missing))

          Order = []
          Visiting = set()
          Done = set()

          def Visit(Name):
              if Name in Done or Name not in Selected:
                  return
              if Name in Visiting:
                  raise SystemExit("dependency cycle at " + Name)
              Visiting.add(Name)
              for Dep in Recipes.get(Name, []):
                  Visit(Dep)
              Visiting.discard(Name)
              Done.add(Name)
              Order.append(Name)

          for Name in sorted(Selected):
              Visit(Name)

          print("names=" + " ".join(Order))
          print("count=" + str(len(Order)))
          PY
          tail -2 "$GITHUB_OUTPUT"

      - name: Rebuild every package with the cross toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/okra-artifacts"
          export OKRA_OAATOOLS="$PWD/okrapm/oaatools"
          echo "bootstrapping ${{ steps.order.outputs.count }} packages"
          Failed=""
          for name in ${{ steps.order.outputs.names }}; do
            echo "== bootstrapping $name"
            if ! OKRA_PACKAGE_MODE=bootstrap ./scripts/build-package.sh "$name"; then
              echo "!! $name failed to bootstrap" >&2
              Failed="$Failed $name"
            fi
          done
          if [ -n "$Failed" ]; then
            echo "these packages failed to bootstrap:$Failed" >&2
            exit 1
          fi

      - name: Verify the bootstrapped packages
        run: |
          set -euo pipefail
          export OKRA_OAATOOLS="$PWD/okrapm/oaatools"
          Loader="$OKRA_TOOLCHAIN/okra-sysroot/lib64/ld-linux-x86-64.so.2"
          LibraryPath="$OKRA_TOOLCHAIN/okra-sysroot/usr/lib:$OKRA_TOOLCHAIN/okra-sysroot/lib64:$OKRA_TOOLCHAIN/okra-sysroot/lib"
          test -f "$Loader" || { echo "no Okra loader" >&2; exit 1; }

          echo "== Okra uname (from the bootstrapped coreutils)"
          Uname="$OKRA_TOOLCHAIN/okra-sysroot/usr/bin/uname"
          if [ -x "$Uname" ]; then
            OkraMachine="$("$Loader" --library-path "$LibraryPath" "$Uname" -m)"
            echo "Okra uname -m: $OkraMachine"
            test "$OkraMachine" = "x86_64"
          fi

          echo "== Okra bash"
          Bash="$OKRA_TOOLCHAIN/okra-sysroot/usr/bin/bash"
          if [ -x "$Bash" ]; then
            "$Loader" --library-path "$LibraryPath" "$Bash" -c 'echo "bash $BASH_VERSION on $(uname -m)"'
          fi

          echo "== every bootstrapped archive is x86_64"
          bad="$(find "$RUNNER_TEMP/okra-artifacts" -name '*.oaa' ! -name '*.x86_64.bootstrapped.oaa' | wc -l)"
          test "$bad" = "0" || { echo "$bad archives are not x86_64 bootstrapped" >&2; exit 1; }
          echo "$(find "$RUNNER_TEMP/okra-artifacts" -name '*.oaa' | wc -l) bootstrapped archives"

      - uses: actions/upload-artifact@v4
        with:
          name: okra-bootstrapped-packages
          path: ${{ runner.temp }}/okra-artifacts/**/*.oaa
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: okra-bootstrapped-metadata
          path: |
            ${{ runner.temp }}/okra-artifacts/**/*.sha256
            ${{ runner.temp }}/okra-artifacts/**/*.build
            ${{ runner.temp }}/okra-artifacts/**/*.sources
          if-no-files-found: warn
          retention-days: 7