name: Bootstrap self-hosting toolchain (experimental)

# This workflow is experimental and manual. It builds a self-hosting Okra
# toolchain and then rebuilds every package with it.
#
# The toolchain stage is cached: once it succeeds, the bootstrap stage
# downloads the cached toolchain and skips the 30-minute rebuild. Push a
# toolchain source change (lib.sh, build-cross-toolchain.sh, glibc/gcc/binutils
# recipes) and the cache key changes automatically.
#
# The supported package pipeline is build-packages.yml, which does not depend
# on this workflow.
on:
  workflow_dispatch:
    inputs:
      rebuild_toolchain:
        description: 'Rebuild the cross toolchain even if a cache hit exists'
        type: boolean
        default: false
      packages:
        description: 'Space separated package list to bootstrap (empty builds all)'
        required: false
        default: ''

permissions:
  contents: read

env:
  OKRA_TOOLCHAIN: /opt/okra-toolchain
  OKRA_TARGET_ARCH: x86_64
  OKRA_JOBS: '4'

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      cache-hit: ${{ steps.cache-toolchain.outputs.cache-hit }}
      artifact-restored: ${{ steps.download-artifact.outputs.artifact-restored }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute cache key
        id: key
        run: |
          set -euo pipefail
          Hash="$(cat scripts/build-cross-toolchain.sh scripts/lib.sh packages/glibc.conf packages/gcc.conf packages/binutils.conf | sha256sum | awk '{print $1}')"
          echo "key=okra-cross-tc-${Hash}" >> "$GITHUB_OUTPUT"

      - name: Restore the cross toolchain from cache
        id: cache-toolchain
        if: ${{ !github.event.inputs.rebuild_toolchain }}
        uses: actions/cache@v4
        with:
          path: ${{ env.OKRA_TOOLCHAIN }}
          key: ${{ steps.key.outputs.key }}

      - name: Try downloading the toolchain artifact from a previous run
        id: download-artifact
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && !github.event.inputs.rebuild_toolchain
        run: |
          set -euo pipefail
          # Find the most recent successful toolchain run that has the
          # okra-cross-toolchain artifact. This avoids rebuilding the 30
          # minute cross toolchain when a cache miss happens but a previous
          # run already produced it.
          for RunId in $(curl -sS -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=20' \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for r in d.get('workflow_runs', []):
              if r.get('conclusion') == 'success' or r.get('conclusion') == 'failure':
                  print(r['id'])
          "); do
            Artifact="$(curl -sS -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RunId/artifacts" \
              | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for a in d.get('artifacts', []):
              if a['name'] == 'okra-cross-toolchain':
                  print(a['archive_download_url'])
                  break
          " || true)"
            if [ -n "$Artifact" ]; then
              echo "== found okra-cross-toolchain artifact in run $RunId"
              curl -sSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H 'Accept: application/vnd.github+json' \
                -o /tmp/toolchain-artifact.zip "$Artifact"
              sudo mkdir -p "$OKRA_TOOLCHAIN"
              sudo chown "$(id -u):$(id -g)" "$OKRA_TOOLCHAIN"
              cd "$OKRA_TOOLCHAIN" && unzip -qo /tmp/toolchain-artifact.zip
              rm -f /tmp/toolchain-artifact.zip
              if [ -x "$OKRA_TOOLCHAIN/cross/bin/x86_64-okra-linux-gnu-gcc" ]; then
                echo "artifact-restored=true" >> "$GITHUB_OUTPUT"
                echo "== toolchain restored from artifact in run $RunId"
                exit 0
              fi
            fi
          done
          echo "artifact-restored=false" >> "$GITHUB_OUTPUT"
          echo "== no usable toolchain artifact found"

      - name: Assert the runner really is x86_64
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.download-artifact.outputs.artifact-restored != 'true'
        run: |
          set -euo pipefail
          echo "uname -m: $(uname -m)"
          echo "uname -a: $(uname -a)"
          test "$(uname -m)" = "x86_64"

      - name: Run the architecture self tests
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.download-artifact.outputs.artifact-restored != 'true'
        run: ./scripts/selftest.sh

      - name: Install host build tools
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.download-artifact.outputs.artifact-restored != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake curl ca-certificates tar xz-utils zstd gzip \
            bzip2 lzip file rsync python3 pkg-config fakeroot wget texinfo bison flex
          sudo mkdir -p "$OKRA_TOOLCHAIN"
          sudo chown "$(id -u):$(id -g)" "$OKRA_TOOLCHAIN"

      - name: Fetch the okrapm toolchain sources
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.download-artifact.outputs.artifact-restored != 'true'
        run: |
          git clone --depth 1 https://github.com/OkraLinux/okrapm.git okrapm
          chmod +x okrapm/oaatools/*

      - name: Build the cross toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.download-artifact.outputs.artifact-restored != 'true'
        run: ./scripts/build-cross-toolchain.sh

      - name: Show what the toolchain produced
        run: |
          set -euo pipefail
          echo "== cross prefix"
          ls "$OKRA_TOOLCHAIN/cross/bin" | head -20
          echo "== gcc target"
          "$OKRA_TOOLCHAIN/cross/bin/x86_64-okra-linux-gnu-gcc" -dumpmachine
          "$OKRA_TOOLCHAIN/cross/bin/x86_64-okra-linux-gnu-gcc" --version | head -1

  bootstrap:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Compute cache key (same as toolchain job)
        id: key
        run: |
          set -euo pipefail
          Hash="$(cat scripts/build-cross-toolchain.sh scripts/lib.sh packages/glibc.conf packages/gcc.conf packages/binutils.conf | sha256sum | awk '{print $1}')"
          echo "key=okra-cross-tc-${Hash}" >> "$GITHUB_OUTPUT"

      - name: Restore the cross toolchain from cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OKRA_TOOLCHAIN }}
          key: ${{ steps.key.outputs.key }}

      - name: Assert the toolchain is present
        run: |
          set -euo pipefail
          test -x "$OKRA_TOOLCHAIN/cross/bin/x86_64-okra-linux-gnu-gcc" || {
            echo "the cross toolchain cache was not restored" >&2
            exit 1
          }
          test -f "$OKRA_TOOLCHAIN/okra-sysroot/lib64/ld-linux-x86-64.so.2" || {
            echo "the Okra dynamic loader is missing" >&2
            exit 1
          }

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates tar xz-utils zstd gzip bzip2 \
            lzip file rsync python3 pkg-config fakeroot wget texinfo bison flex \
            autoconf automake libtool gettext autopoint meson ninja-build gperf
          sudo mkdir -p "$OKRA_TOOLCHAIN"
          sudo chown "$(id -u):$(id -g)" "$OKRA_TOOLCHAIN"

      - name: Fetch the okrapm toolchain sources
        run: |
          git clone --depth 1 https://github.com/OkraLinux/okrapm.git okrapm
          chmod +x okrapm/oaatools/*

      - name: Work out the bootstrap order
        id: order
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, re

          Requested = "${{ github.event.inputs.packages }}".split()
          Recipes = {}
          for Path in sorted(pathlib.Path("packages").glob("*.conf")):
              Text = Path.read_text(encoding="utf-8")
              Match = re.search(r"^Dependencies=\((.*)\)$", Text, re.M)
              Recipes[Path.stem] = Match.group(1).split() if Match else []

          AlwaysSkip = {"glibc"}
          Selected = set(Requested) if Requested else set(Recipes) - AlwaysSkip
          Missing = sorted(Selected - set(Recipes))
          if Missing:
              raise SystemExit("unknown packages: " + " ".join(Missing))

          Order = []
          Visiting = set()
          Done = set()

          def Visit(Name):
              if Name in Done or Name not in Selected:
                  return
              if Name in Visiting:
                  raise SystemExit("dependency cycle at " + Name)
              Visiting.add(Name)
              for Dep in Recipes.get(Name, []):
                  Visit(Dep)
              Visiting.discard(Name)
              Done.add(Name)
              Order.append(Name)

          for Name in sorted(Selected):
              Visit(Name)

          print("names=" + " ".join(Order))
          print("count=" + str(len(Order)))
          PY
          cat "$GITHUB_OUTPUT" | tail -2

      - name: Rebuild every package with the cross toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/okra-artifacts"
          export OKRA_OAATOOLS="$PWD/okrapm/oaatools"
          echo "bootstrapping ${{ steps.order.outputs.count }} packages"
          for name in ${{ steps.order.outputs.names }}; do
            echo "== bootstrapping $name"
            OKRA_PACKAGE_MODE=bootstrap ./scripts/build-package.sh "$name" || {
              echo "!! $name failed; continuing to collect partial results" >&2
              touch "$RUNNER_TEMP/okra-artifacts/bootstrap-failed"
            }
          done
          test ! -f "$RUNNER_TEMP/okra-artifacts/bootstrap-failed" || {
            echo "one or more packages failed to bootstrap" >&2
            exit 1
          }

      - name: Verify the bootstrapped packages
        run: |
          set -euo pipefail
          export OKRA_OAATOOLS="$PWD/okrapm/oaatools"
          Loader="$OKRA_TOOLCHAIN/okra-sysroot/lib64/ld-linux-x86-64.so.2"
          LibraryPath="$OKRA_TOOLCHAIN/okra-sysroot/usr/lib:$OKRA_TOOLCHAIN/okra-sysroot/lib64:$OKRA_TOOLCHAIN/okra-sysroot/lib"
          test -f "$Loader" || { echo "no Okra loader" >&2; exit 1; }

          echo "== Okra uname (from the bootstrapped coreutils)"
          Uname="$OKRA_TOOLCHAIN/okra-sysroot/usr/bin/uname"
          if [ -x "$Uname" ]; then
            OkraMachine="$("$Loader" --library-path "$LibraryPath" "$Uname" -m)"
            echo "Okra uname -m: $OkraMachine"
            test "$OkraMachine" = "x86_64"
          fi

          echo "== Okra bash"
          Bash="$OKRA_TOOLCHAIN/okra-sysroot/usr/bin/bash"
          if [ -x "$Bash" ]; then
            "$Loader" --library-path "$LibraryPath" "$Bash" -c 'echo "bash $BASH_VERSION on $(uname -m)"'
          fi

          echo "== every bootstrapped archive is x86_64"
          bad="$(find "$RUNNER_TEMP/okra-artifacts" -name '*.oaa' ! -name '*.x86_64.bootstrapped.oaa' | wc -l)"
          test "$bad" = "0" || { echo "$bad archives are not x86_64 bootstrapped" >&2; exit 1; }
          echo "$(find "$RUNNER_TEMP/okra-artifacts" -name '*.oaa' | wc -l) bootstrapped archives"

      - uses: actions/upload-artifact@v4
        with:
          name: okra-bootstrapped-packages
          path: ${{ runner.temp }}/okra-artifacts/**/*.oaa
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: okra-bootstrapped-metadata
          path: |
            ${{ runner.temp }}/okra-artifacts/**/*.sha256
            ${{ runner.temp }}/okra-artifacts/**/*.build
            ${{ runner.temp }}/okra-artifacts/**/*.sources
          if-no-files-found: warn
          retention-days: 7